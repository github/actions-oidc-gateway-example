name: Run CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '*.go'
  workflow_dispatch:

jobs:
  run_ci:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
        with:
          go-version: 1.18
      - run: go test
